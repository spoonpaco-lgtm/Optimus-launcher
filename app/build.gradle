plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.spoonpaco.optimuslauncher'
    compileSdk 34

    defaultConfig {
        applicationId "nl.spoonpaco.optimuslauncher"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "0.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
