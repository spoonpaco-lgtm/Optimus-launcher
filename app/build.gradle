plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("OPTIMUS_KEYSTORE")
def keystorePassword = System.getenv("OPTIMUS_KEYSTORE_PASSWORD")
def hasFixedKey = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace 'nl.spoonpaco.optimuslauncher'
    compileSdk 34

    defaultConfig {
        applicationId "nl.spoonpaco.optimuslauncher"
        minSdk 27
        targetSdk 34
        versionCode 7
        versionName "0.0.7"
    }

    signingConfigs {
        if (hasFixedKey) {
            optimus {
                storeFile file(keystorePath)
                storeType "pkcs12"
                storePassword keystorePassword
                keyAlias "optimus"
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Vaste sleutel als die er is (nodig voor zelf-update),
            // anders de debug-sleutel zodat de APK in elk geval installeerbaar is.
            signingConfig hasFixedKey ? signingConfigs.optimus : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
