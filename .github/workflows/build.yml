name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.OPTIMUS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/optimus.p12"
            echo "OPTIMUS_KEYSTORE=$RUNNER_TEMP/optimus.p12" >> "$GITHUB_ENV"
            echo "Vaste sleutel gevonden"
          else
            echo "::warning::Geen vaste sleutel: APK wordt met debug-sleutel ondertekend (zelf-update werkt dan niet tussen builds)"
          fi

      - name: Build release APK
        env:
          OPTIMUS_KEYSTORE_PASSWORD: ${{ secrets.OPTIMUS_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Name APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "optimus-launcher-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: optimus
          path: |
            optimus-launcher-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Optimus Launcher ${{ steps.ver.outputs.version }}
          files: |
            optimus-launcher-${{ steps.ver.outputs.version }}.apk
          make_latest: true
